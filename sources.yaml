# Source registry: inbox subdirectory (under INBOX_ROOT=/home/chuck/data/finance)
# -> adapter. The watcher polls each dir for files, runs the adapter, then
# moves the file to processed/.
#
# Layout:
#   starone/               Starone enriched transaction CSVs (v1)
#   tax/                   Choukalos Finances Summary XLSX (v1)
#   inbox/                 generic CSV/TSV datasets (v2a) — resolved per file:
#                          bank/tax adapters claim first, then active
#                          hub.datasets source_patterns; unmatched files stay
#                          pending (adapter: generic_csv is a sentinel, not a
#                          registered adapter)
#   v3-starone-raw/        raw per-account Starone exports (NOT watched — v3)
#   v4-expense-analysis/   road-trip analysis workbooks (NOT watched — v4)
#   skip/                  pivot artifacts, not transaction data (NOT watched)
#   processed/             managed by data-hub (auto-created)
sources:
  - dir: starone
    adapter: starone_csv
  - dir: tax
    adapter: tax_xlsx
  - dir: inbox
    adapter: generic_csv

poll_seconds: 10
processed_dirname: processed